name: Signon Regression Self-Hosted

on:
  workflow_dispatch:
    inputs:
      outer_workspace_root:
        description: Optional HLengine outer workspace root. Leave blank to infer from the checked-out host repo parent.
        required: false
        type: string
      build_dir:
        description: Optional build directory. Relative paths resolve from the outer workspace root.
        required: false
        type: string
      exe_path:
        description: Optional explicit hlhost.exe path. Relative paths resolve from the outer workspace root.
        required: false
        type: string
      provenance_mode:
        description: Provenance policy for current-main verification.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - runtime
          - workspace
      no_build:
        description: Reuse an existing binary instead of building a fresh one.
        required: false
        default: false
        type: boolean
      use_existing_binary:
        description: Reuse the configured build output path without rebuilding.
        required: false
        default: false
        type: boolean
      skip_recovery:
        description: Skip the recovery lane.
        required: false
        default: false
        type: boolean
      no_execute:
        description: Print the build and verification commands without launching the happy/gate/recovery runs.
        required: false
        default: false
        type: boolean
      run_neighbor_surface_suite:
        description: Also run the opt-in neighboring checkpoint/token/claimed-checkpoint surface suite.
        required: false
        default: false
        type: boolean
      profile_mode:
        description: Neighboring-surface profile selection mode when run_neighbor_surface_suite is enabled.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - explicit
      diff_base:
        description: Diff base used when profile_mode=auto. Leave blank to let the wrapper fall back to origin/main.
        required: false
        default: origin/main
        type: string
      diff_head:
        description: Diff head used when profile_mode=auto. Leave blank to let the wrapper fall back to HEAD.
        required: false
        default: HEAD
        type: string
      neighbor_surface_profile:
        description: Optional explicit neighboring-surface profile shorthand (`default`, `checkpoint-extended`, or `full-expanded`) when run_neighbor_surface_suite is enabled and profile_mode=explicit.
        required: false
        type: string
      neighbor_surface_group:
        description: Optional comma- or newline-separated neighboring-surface groups to run when run_neighbor_surface_suite is enabled.
        required: false
        type: string
      neighbor_surface:
        description: Optional comma- or newline-separated neighboring surfaces to run when run_neighbor_surface_suite is enabled.
        required: false
        type: string
      full_neighbor_matrix:
        description: Run the full expanded neighboring-surface matrix when run_neighbor_surface_suite is enabled.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resumed-denial-regression:
    name: Signon regression suites
    runs-on:
      - self-hosted
      - windows

    defaults:
      run:
        shell: powershell
        working-directory: host

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: host

      - name: Show self-hosted prerequisites
        run: |
          Write-Host "Self-hosted prerequisites:"
          Write-Host "  - the checkout should live at <outer-workspace>\\host, or outer_workspace_root must point at that outer workspace"
          Write-Host "  - the outer workspace root must contain CMakeLists.txt"
          Write-Host "  - logs/latest/HL-CL-20260411-163-dedicated-goldsrc-signon-carried-checkpoint-claimed-checkpoint-resumed-denial-surface/runtime/valve-fixture must exist in the checked-out repo"
          Write-Host "  - Visual Studio 2022 CMake support or cmake.exe in PATH is required when a build is requested"
          Write-Host "Missing prerequisites are expected to fail the wrapper early with actionable diagnostics."

      - name: Run signon regression suites
        id: run_regression
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'signon-regression'
          if (Test-Path $artifactDir) {
            Remove-Item -LiteralPath $artifactDir -Recurse -Force
          }

          $arguments = @(
            '-NoLogo',
            '-NoProfile',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            '.\tools\verify_resumed_denial_ci.ps1',
            '-RepoRoot',
            (Get-Location).Path,
            '-CollectArtifacts',
            '-ArtifactOutputDir',
            $artifactDir
          )

          if ('${{ inputs.outer_workspace_root }}' -ne '') {
            $arguments += @('-OuterWorkspaceRoot', '${{ inputs.outer_workspace_root }}')
          }

          if ('${{ inputs.build_dir }}' -ne '') {
            $arguments += @('-BuildDir', '${{ inputs.build_dir }}')
          }

          if ('${{ inputs.exe_path }}' -ne '') {
            $arguments += @('-ExePath', '${{ inputs.exe_path }}')
          }

          if ('${{ inputs.provenance_mode }}' -ne '') {
            $arguments += @('-ProvenanceMode', '${{ inputs.provenance_mode }}')
          }

          if ('${{ inputs.no_build }}' -eq 'true') {
            $arguments += '-NoBuild'
          }

          if ('${{ inputs.use_existing_binary }}' -eq 'true') {
            $arguments += '-UseExistingBinary'
          }

          if ('${{ inputs.skip_recovery }}' -eq 'true') {
            $arguments += '-SkipRecovery'
          }

          if ('${{ inputs.no_execute }}' -eq 'true') {
            $arguments += '-NoExecute'
          }

          if ('${{ inputs.run_neighbor_surface_suite }}' -eq 'true') {
            $arguments += '-RunNeighborSurfaceSuite'
          }

          if ('${{ inputs.run_neighbor_surface_suite }}' -ne 'true' -and ('${{ inputs.neighbor_surface_profile }}' -ne '' -or '${{ inputs.neighbor_surface_group }}' -ne '' -or '${{ inputs.neighbor_surface }}' -ne '' -or '${{ inputs.full_neighbor_matrix }}' -eq 'true')) {
            throw 'neighbor_surface_profile, neighbor_surface_group, neighbor_surface, and full_neighbor_matrix require run_neighbor_surface_suite=true.'
          }

          $neighborGroupValues = @('${{ inputs.neighbor_surface_group }}' -split '[,\r\n]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' })
          $neighborSurfaceValues = @('${{ inputs.neighbor_surface }}' -split '[,\r\n]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' })
          if ('${{ inputs.run_neighbor_surface_suite }}' -eq 'true') {
            $profileMode = '${{ inputs.profile_mode }}'
            if ($profileMode -eq 'auto') {
              if ('${{ inputs.neighbor_surface_profile }}' -ne '' -or $neighborGroupValues.Count -gt 0 -or $neighborSurfaceValues.Count -gt 0 -or '${{ inputs.full_neighbor_matrix }}' -eq 'true') {
                throw 'profile_mode=auto cannot be combined with neighbor_surface_profile, neighbor_surface_group, neighbor_surface, or full_neighbor_matrix.'
              }

              $arguments += @('-NeighborSurfaceProfile', 'auto')
              if ('${{ inputs.diff_base }}' -ne '') {
                $arguments += @('-DiffBase', '${{ inputs.diff_base }}')
              }
              if ('${{ inputs.diff_head }}' -ne '') {
                $arguments += @('-DiffHead', '${{ inputs.diff_head }}')
              }
            }
            else {
              if ('${{ inputs.neighbor_surface_profile }}' -ne '') {
                if ($neighborGroupValues.Count -gt 0 -or $neighborSurfaceValues.Count -gt 0 -or '${{ inputs.full_neighbor_matrix }}' -eq 'true') {
                  throw 'neighbor_surface_profile cannot be combined with neighbor_surface_group, neighbor_surface, or full_neighbor_matrix.'
                }

                $arguments += @('-NeighborSurfaceProfile', '${{ inputs.neighbor_surface_profile }}')
              }

              if ($neighborGroupValues.Count -gt 0) {
                $arguments += @('-NeighborSurfaceGroup') + $neighborGroupValues
              }

              if ($neighborSurfaceValues.Count -gt 0) {
                $arguments += @('-NeighborSurface') + $neighborSurfaceValues
              }

              if ('${{ inputs.full_neighbor_matrix }}' -eq 'true') {
                if ($neighborGroupValues.Count -gt 0 -or $neighborSurfaceValues.Count -gt 0) {
                  throw 'full_neighbor_matrix cannot be combined with neighbor_surface_group or neighbor_surface.'
                }

                $arguments += '-FullNeighborMatrix'
              }
            }
          }

          $neighborJUnitPath = ''
          if ('${{ inputs.run_neighbor_surface_suite }}' -eq 'true') {
            $neighborJUnitPath = Join-Path $artifactDir 'neighbor-surfaces\signon_neighbor_surface_junit.xml'
            $arguments += @('-JUnitOutputPath', $neighborJUnitPath)
          }

          $quotedArguments = $arguments | ForEach-Object {
            if ($_ -match '[\s"]') {
              '"' + ($_ -replace '"', '\"') + '"'
            }
            else {
              $_
            }
          }
          Write-Host ('==> powershell ' + ($quotedArguments -join ' '))

          & powershell @arguments
          $exitCode = $LASTEXITCODE

          "artifact_dir=$artifactDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($neighborJUnitPath -ne '') {
            "neighbor_junit_path=$neighborJUnitPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          $combinedSummaryJsonPath = Join-Path $artifactDir 'verification_suite_summary.json'
          $resumedSummaryJsonPath = Join-Path $artifactDir 'resumed_denial_summary.json'
          if (-not (Test-Path $resumedSummaryJsonPath)) {
            $resumedSummaryJsonPath = Join-Path $artifactDir 'resumed-denial\resumed_denial_summary.json'
          }
          if (Test-Path $combinedSummaryJsonPath) {
            "summary_json=$combinedSummaryJsonPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          elseif (Test-Path $resumedSummaryJsonPath) {
            "summary_json=$resumedSummaryJsonPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

          exit 0

      - name: Write step summary
        if: always()
        run: |
          $artifactDir = '${{ steps.run_regression.outputs.artifact_dir }}'
          $summaryJsonPath = '${{ steps.run_regression.outputs.summary_json }}'
          $artifactName = 'signon-regression-${{ github.run_id }}-${{ github.run_attempt }}'
          $summaryLines = New-Object System.Collections.Generic.List[string]
          $summaryLines.Add('## Signon regression suites')
          $summaryLines.Add('')

          if (-not [string]::IsNullOrWhiteSpace($summaryJsonPath) -and (Test-Path $summaryJsonPath)) {
            $summary = Get-Content -LiteralPath $summaryJsonPath -Raw | ConvertFrom-Json
            if ($summary.PSObject.Properties['suites']) {
              $summaryLines.Add(("Overall result: `{0}`" -f $summary.overallResult))
              $summaryLines.Add(("Requested provenance: `{0}`" -f $summary.requestedProvenanceMode))
              $summaryLines.Add(("Artifact bundle: `{0}`" -f $artifactName))
              $summaryLines.Add(("Runner artifact dir: `{0}`" -f $artifactDir))
              $summaryLines.Add('')
              $summaryLines.Add('| Suite | Result | Observed provenance |')
              $summaryLines.Add('| --- | --- | --- |')
              foreach ($suite in $summary.suites) {
                $summaryLines.Add(("| {0} | {1} | {2} |" -f $suite.name, $suite.result, $suite.observedProvenanceMode))
              }
              $summaryLines.Add('')
              $summaryLines.Add('| Resumed-denial scenario | Result | Provenance |')
              $summaryLines.Add('| --- | --- | --- |')
              foreach ($scenarioName in @('happy', 'gate', 'recovery')) {
                $scenarioStatus = $summary.resumedDenial.scenarioStatuses.$scenarioName
                $scenarioProvenance = $summary.resumedDenial.scenarioProvenance.$scenarioName
                $summaryLines.Add(("| {0} | {1} | {2} |" -f $scenarioName, $scenarioStatus, $scenarioProvenance))
              }
              if ($summary.runNeighborSurfaceSuite) {
                $summaryLines.Add('')
                $summaryLines.Add(("Neighbor-surface suite: `{0}`" -f $summary.neighborSurfaces.overallResult))
                if ($summary.neighborSurfaces.requestedProfileMode) {
                  $summaryLines.Add(("Profile mode: `{0}`" -f $summary.neighborSurfaces.requestedProfileMode))
                }
                if ($summary.neighborSurfaces.requestedProfile) {
                  $summaryLines.Add(("Requested profile: `{0}`" -f $summary.neighborSurfaces.requestedProfile))
                }
                if ($summary.neighborSurfaces.resolvedProfile) {
                  $summaryLines.Add(("Resolved profile: `{0}`" -f $summary.neighborSurfaces.resolvedProfile))
                }
                if ($summary.neighborSurfaces.selectionOrigin) {
                  $summaryLines.Add(("Selection origin: `{0}`" -f $summary.neighborSurfaces.selectionOrigin))
                }
                if ($summary.neighborSurfaces.profileSelectionReason) {
                  $summaryLines.Add(("Profile selection reason: `{0}`" -f $summary.neighborSurfaces.profileSelectionReason))
                }
                if ($summary.neighborSurfaces.profileSelectionRuleIds) {
                  $summaryLines.Add(("Matched profile rules: `{0}`" -f (($summary.neighborSurfaces.profileSelectionRuleIds | Where-Object { $_ -ne '' }) -join ', ')))
                }
                if ($summary.neighborSurfaces.profileSelectionDiffBase) {
                  $summaryLines.Add(("Diff base: `{0}`" -f $summary.neighborSurfaces.profileSelectionDiffBase))
                }
                if ($summary.neighborSurfaces.profileSelectionDiffHead) {
                  $summaryLines.Add(("Diff head: `{0}`" -f $summary.neighborSurfaces.profileSelectionDiffHead))
                }
                if ($summary.neighborSurfaces.selectionMode) {
                  $summaryLines.Add(("Selection mode: `{0}`" -f $summary.neighborSurfaces.selectionMode))
                }
                if ($summary.neighborSurfaces.requestedFullMatrix) {
                  $summaryLines.Add('Full matrix requested: `yes`')
                }
                if ($summary.neighborSurfaces.selectedGroupNames) {
                  $summaryLines.Add(("Selected groups: `{0}`" -f (($summary.neighborSurfaces.selectedGroupNames | Where-Object { $_ -ne '' }) -join ', ')))
                }
                if ($summary.neighborSurfaces.selectedSurfaceNames) {
                  $summaryLines.Add(("Selected surfaces: `{0}`" -f (($summary.neighborSurfaces.selectedSurfaceNames | Where-Object { $_ -ne '' }).Count)))
                }
                $summaryLines.Add(("Passing surfaces: `{0}`" -f $summary.neighborSurfaces.passingSurfaceCount))
                $summaryLines.Add(("Failing surfaces: `{0}`" -f $summary.neighborSurfaces.failingSurfaceCount))
                if ($summary.neighborSurfaces.junitOutputPath) {
                  $summaryLines.Add(("JUnit output: `{0}`" -f $summary.neighborSurfaces.junitOutputPath))
                }
                if ($summary.neighborSurfaces.groups) {
                  $summaryLines.Add('')
                  $summaryLines.Add('| Neighbor group | Result | Surfaces |')
                  $summaryLines.Add('| --- | --- | --- |')
                  foreach ($group in $summary.neighborSurfaces.groups) {
                    $summaryLines.Add(("| {0} | {1} | {2} |" -f $group.name, $group.overallStatus, (($group.surfaceNames | Where-Object { $_ -ne '' }) -join ', ')))
                  }
                }
                if ($summary.neighborSurfaces.failedSurfaces) {
                  $failedSurfaces = @($summary.neighborSurfaces.failedSurfaces | Where-Object { $_.name -ne '' })
                  if ($failedSurfaces.Count -gt 0) {
                    $summaryLines.Add('')
                    $summaryLines.Add('| Failed surface | Profile | Groups | Reason |')
                    $summaryLines.Add('| --- | --- | --- | --- |')
                    foreach ($failedSurface in $failedSurfaces) {
                      $profileLabel = if ($failedSurface.profile) { $failedSurface.profile } else { '<none>' }
                      $groupLabel = if ($failedSurface.groups) { (($failedSurface.groups | Where-Object { $_ -ne '' }) -join ', ') } else { '<none>' }
                      $reasonLabel = if ($failedSurface.conciseReason) { $failedSurface.conciseReason } else { 'See artifact bundle' }
                      $summaryLines.Add(("| {0} | {1} | {2} | {3} |" -f $failedSurface.name, $profileLabel, $groupLabel, $reasonLabel))
                    }
                  }
                }
              }
            }
            else {
              $summaryLines.Add(("Overall result: `{0}`" -f $summary.overallResult))
              $summaryLines.Add(("Requested provenance: `{0}`" -f $summary.requestedProvenanceMode))
              $summaryLines.Add(("Observed provenance: `{0}`" -f $summary.observedProvenanceMode))
              $summaryLines.Add(("Artifact bundle: `{0}`" -f $artifactName))
              $summaryLines.Add(("Runner artifact dir: `{0}`" -f $artifactDir))
              $summaryLines.Add('')
              $summaryLines.Add('| Scenario | Result | Provenance |')
              $summaryLines.Add('| --- | --- | --- |')
              foreach ($scenario in $summary.scenarios) {
                $summaryLines.Add(("| {0} | {1} | {2} |" -f $scenario.name, $scenario.status, $scenario.provenanceMode))
              }
            }
          }
          else {
            $summaryLines.Add(("Summary JSON was not created. Wrapper exit code: `{0}`" -f '${{ steps.run_regression.outputs.exit_code }}'))
            if (-not [string]::IsNullOrWhiteSpace($artifactDir)) {
              $summaryLines.Add(("Runner artifact dir: `{0}`" -f $artifactDir))
            }
          }

          $summaryLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload signon regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signon-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run_regression.outputs.artifact_dir }}
          if-no-files-found: warn

      - name: Upload signon regression JUnit
        if: always() && steps.run_regression.outputs.neighbor_junit_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: signon-regression-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run_regression.outputs.neighbor_junit_path }}
          if-no-files-found: warn

      - name: Fail on verification error
        if: always()
        run: |
          if ('${{ steps.run_regression.outputs.exit_code }}' -ne '0') {
            throw ("Resumed-denial regression failed with exit code {0}." -f '${{ steps.run_regression.outputs.exit_code }}')
          }
